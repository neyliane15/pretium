# Configuração do Supabase CLI para desenvolvimento local (`supabase start`).
# Referência: https://supabase.com/docs/guides/local-development/cli/config
project_id = "pretium"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 5000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

# Servidor de e-mail local (Inbucket/Mailpit) fica com os padrões do CLI (porta 54324).
# A seção mudou de nome entre versões do CLI ([inbucket] até a 2.x, [local_smtp] na 3.x) —
# omiti-la mantém o arquivo compatível com as duas.

[storage]
enabled = true
file_size_limit = "60MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/login", "http://localhost:5173/redefinir-senha", "http://localhost:5173/convite/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8

[auth.email]
# `enable_signup` (aceito pelo CLI 2.x e 3.x; o 3.x avisa que prefere `enabled`)
enable_signup = true
double_confirm_changes = true
# Local: sem confirmação para agilizar testes. EM PRODUÇÃO ligue "Confirm email" no painel do
# Supabase (Authentication → Sign In / Providers → Email): o aceite de convites confia no e-mail.
enable_confirmations = false
max_frequency = "1m0s"

[auth.rate_limit]
email_sent = 30

[edge_runtime]
enabled = false

[analytics]
enabled = false

[realtime]
# Não usado pelo app. Desligado também porque o container falha em hosts sem IPv6.
enabled = false
